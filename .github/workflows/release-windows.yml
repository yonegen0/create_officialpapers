name: Windows ZIP distribution
on:
  workflow_dispatch:
  # One distribution build on changes to this workflow, not on every push.
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-windows.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Build onedir ZIP
        shell: cmd
        run: build_release.bat
      - name: Validate ZIP content and extraction
        shell: pwsh
        run: |
          $zip = 'release/MarkdownToWord-0.1.0-win-x64.zip'
          if (!(Test-Path $zip)) { throw 'ZIP missing' }
          $folder = Join-Path $env:RUNNER_TEMP 'markdown-to-word-unpacked'
          Expand-Archive -Path $zip -DestinationPath $folder -Force
          if (!(Test-Path (Join-Path $folder 'MarkdownToWord/MarkdownToWord.exe'))) { throw 'EXE missing after unzip' }
          if (!(Test-Path (Join-Path $folder 'MarkdownToWord/_internal'))) { throw 'onedir dependencies missing' }
      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownToWord-0.1.0-win-x64
          path: release/MarkdownToWord-0.1.0-win-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish initial release (no overwrite)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $tag = 'v0.1.0'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
          } else {
            gh release create $tag 'release/MarkdownToWord-0.1.0-win-x64.zip' --repo $repo --target '${{ github.sha }}' --title 'MarkdownToWord 0.1.0 (Windows x64)' --notes 'Windows x64 onedir ZIP. Windows 11実機でのGUI動作は未検証です。'
            if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
          }
