name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime/test dependencies
        run: |
          python -m pip install -r requirements-win11.lock
          python -m pip install pytest==9.0.2
      - name: Check syntax
        run: python -m compileall -q markdown_to_word
      - name: Unit tests
        run: python -m pytest -q
